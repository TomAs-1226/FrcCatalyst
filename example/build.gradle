plugins {
    id "java"
}

// ---------------------------------------------------------------------------
// Why this is a plain java project and not a GradleRIO one
//
// GradleRIO 2027 stops at alpha-2 on the Gradle Plugin Portal. The alpha-5/6 plugin ships only
// inside the 2.6 GB WPILib 2027 installer's local maven, so this project cannot apply it on a
// machine that has not run that installer - which includes CI.
//
// The example's job is to prove Catalyst's API is usable and to show teams how it is used. That
// only needs compilation against the library, which is what this does. Deploying it needs the
// installer, and the deploy configuration that requires is recorded at the bottom of this file so
// it can be pasted back in rather than rediscovered.
//
// Switch this to a real GradleRIO project once the installer is present. Nothing in src/ changes.
// ---------------------------------------------------------------------------

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://frcmaven.wpi.edu/artifactory/development/" }
    maven { url "https://frcmaven.wpi.edu/artifactory/release/" }
    maven { url "https://maven.ctr-electronics.com/release/" }
    maven { url "https://3015rangerrobotics.github.io/pathplannerlib/repo" }
    maven { url "https://limelightvision.github.io/limelightlib-public/maven/" }
}

dependencies {
    // The library under test. Catalyst re-exports WPILib, Phoenix, PathPlanner and LimelightLib as
    // `api` dependencies, so this one line brings the whole compile classpath with it - which is
    // itself worth checking, since a team's project gets exactly this.
    implementation project(':')
}

// ---------------------------------------------------------------------------
// Deploy configuration, for when GradleRIO 2027 is available
//
// Read off SystemCoreTesting/testprojects/pwmoutput rather than guessed. Restore the
// `edu.wpi.first.GradleRIO2027` plugin above and uncomment:
//
//   def ROBOT_MAIN_CLASS = "frc.robot.Main"
//
//   deploy {
//       targets {
//           systemcore(getTargetTypeClass('SystemCore')) {
//               team = project.frc.getTeamNumber()
//               debug = project.frc.getDebugOrDefault(false)
//               artifacts {
//                   frcJava(getArtifactTypeClass('FRCJavaArtifact')) {}
//                   frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
//                       files = project.fileTree('src/main/deploy')
//                       directory = '/home/systemcore/deploy'
//                       deleteOldFiles = false
//                   }
//               }
//           }
//       }
//   }
//
// Note the differences from 2026: the target type is `SystemCore`, not `RoboRIO`, and the deploy
// directory is /home/systemcore/deploy, not /home/lvuser/deploy. The robot program runs as the
// `systemcore` user from /home/systemcore/robotCommand, and its service waits for all five CAN
// buses to come up before starting.
// ---------------------------------------------------------------------------
