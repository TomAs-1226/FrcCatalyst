plugins {
    id "java"
}

// ---------------------------------------------------------------------------
// Why this is a plain java project and not a GradleRIO one
//
// GradleRIO 2027 stops at alpha-2 on the Gradle Plugin Portal. The alpha-5/6 plugin ships only
// inside the 2.6 GB WPILib 2027 installer's local maven, so this project cannot apply it on a
// machine that has not run that installer - which includes CI.
//
// The example's job is to prove Catalyst's API is usable and to show teams how it is used. That
// only needs compilation against the library, which is what this does. Deploying it needs the
// installer, and the deploy configuration that requires is recorded at the bottom of this file so
// it can be pasted back in rather than rediscovered.
//
// Switch this to a real GradleRIO project once the installer is present. Nothing in src/ changes.
// ---------------------------------------------------------------------------

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://frcmaven.wpi.edu/artifactory/development/" }
    maven { url "https://frcmaven.wpi.edu/artifactory/release/" }
    maven { url "https://maven.ctr-electronics.com/release/" }
    maven { url "https://3015rangerrobotics.github.io/pathplannerlib/repo" }
    maven { url "https://limelightvision.github.io/limelightlib-public/maven/" }
}

dependencies {
    // The library under test. Catalyst re-exports WPILib, Phoenix, PathPlanner and LimelightLib as
    // `api` dependencies, so this one line brings the whole compile classpath with it - which is
    // itself worth checking, since a team's project gets exactly this.
    implementation project(':')
}

// ---------------------------------------------------------------------------
// Deploy configuration, for when GradleRIO 2027 is available
//
// Read off SystemCoreTesting/testprojects/pwmoutput rather than guessed. Restore the
// `edu.wpi.first.GradleRIO2027` plugin above and uncomment:
//
//   def ROBOT_MAIN_CLASS = "frc.robot.Main"
//
//   // Commands v3 runs on JDK continuations, reached by reflection into jdk.internal.vm. Without
//   // both of these the robot boots normally and then throws ExceptionInInitializerError the first
//   // time any command is scheduled. See frc.lib.catalyst.command.CommandRuntime.
//   frc {
//       jvmArgs.addAll([
//           "--add-opens", "java.base/jdk.internal.vm=ALL-UNNAMED",
//           "--add-opens", "java.base/java.lang=ALL-UNNAMED",
//       ])
//   }
//
//   deploy {
//       targets {
//           systemcore(getTargetTypeClass('SystemCore')) {
//               team = project.frc.getTeamNumber()
//               debug = project.frc.getDebugOrDefault(false)
//               artifacts {
//                   frcJava(getArtifactTypeClass('FRCJavaArtifact')) {}
//                   frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
//                       files = project.fileTree('src/main/deploy')
//                       directory = '/home/systemcore/deploy'
//                       deleteOldFiles = false
//                   }
//               }
//           }
//       }
//   }
//
// Note the differences from 2026: the target type is `SystemCore`, not `RoboRIO`, and the deploy
// directory is /home/systemcore/deploy, not /home/lvuser/deploy. The robot program runs as the
// `systemcore` user from /home/systemcore/robotCommand, and its service waits for all five CAN
// buses to come up before starting.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Running it
//
// `gradlew :example:simulate` starts the robot program on this machine, with no Systemcore and no
// WPILib installer. That matters more than it sounds: GradleRIO 2027 ships only inside the 2.6 GB
// installer, so until that is present there is no `deploy` and no `simulateJava` - and without a
// task here there was no way to run the example at all, only to compile it.
//
// What it takes to actually start is the whole reason this is fifteen lines and not one:
//
//   - Both --add-opens flags. Commands v3 runs on JDK continuations reached by reflection into
//     jdk.internal.vm. Without them the robot boots, the dashboard connects, and the first command
//     scheduled throws from inside WPILib naming nothing in this project.
//   - The desktop JNI natives, unpacked by the root project's extractNativeLibs. WPILib's and
//     Phoenix's loaders both answer a missing native by terminating the JVM rather than throwing,
//     so a missing one looks like the program exiting silently.
//   - PATH as well as java.library.path. The JNI stubs are found via java.library.path, but each
//     stub links against its own implementation library and Windows resolves *those* off PATH.
//
// Once it is up, SimCockpit serves a field view at http://localhost:5805 - drive with WASD, watch
// the mechanisms respond, and read any errors the robot reports.
// ---------------------------------------------------------------------------
tasks.register('simulate', JavaExec) {
    group = 'catalyst'
    description = 'Run the example robot program in simulation. Cockpit at http://localhost:5805'

    dependsOn rootProject.tasks.named('extractNativeLibs')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'frc.robot.Main'
    standardInput = System.in

    jvmArgs '--add-opens', 'java.base/jdk.internal.vm=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED'

    doFirst {
        def libs = rootProject.layout.buildDirectory.dir('nativeLibs').get().asFile.absolutePath
        systemProperty 'java.library.path', libs

        // Windows names the variable "Path", not "PATH". Setting "PATH" alongside it adds a second
        // entry the loader ignores, so extend whichever key the environment actually uses.
        def pathKey = System.getenv().keySet().find { it.equalsIgnoreCase('PATH') } ?: 'PATH'
        environment pathKey, libs + File.pathSeparator + (System.getenv(pathKey) ?: '')
        environment 'LD_LIBRARY_PATH', libs + File.pathSeparator + (System.getenv('LD_LIBRARY_PATH') ?: '')
        environment 'DYLD_LIBRARY_PATH', libs + File.pathSeparator + (System.getenv('DYLD_LIBRARY_PATH') ?: '')
    }
}

