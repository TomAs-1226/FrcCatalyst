name: Build

on:
  push:
    branches: [ main, master, systemcore ]
  pull_request:
    branches: [ main, master, systemcore ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 25, not 17. WPILib 2027 ships Java 25 bytecode and Gradle cannot read it on anything older.
      # The failure is "Unsupported class file major version 69", which names neither the JDK that is
      # too old nor the dependency that needs a newer one.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FrcCatalyst
          path: build/libs/*.jar
