name: Deploy Docs

# This branch cannot publish the site itself, and should stop trying.
#
# GitHub runs the workflow file from the branch that was pushed, and the `github-pages` environment
# has a branch policy naming `main` alone. So a docs push here built a perfectly good artifact and
# then failed at the deploy step — the build was green, the site never moved, and the only sign was
# a red run nobody was watching. Before that it was worse: this file still triggered on `systemcore`,
# a branch retired on 2026-09-19, so pushes matched nothing at all and failed silently.
#
# So it asks main's workflow to run instead. That one checks out BOTH branches and builds both sites
# — main at the root, this branch under /beta/ — so whichever branch set it going, what gets
# published is the current content of both. There is no version of this that publishes a stale beta.

on:
  push:
    branches: [ systemcore-alpha6 ]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ask-main:
    runs-on: ubuntu-latest
    steps:
      - name: Run the Pages build on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run docs.yml --repo "${{ github.repository }}" --ref main
          echo "Asked main to rebuild both sites; watch it in the Actions tab."
