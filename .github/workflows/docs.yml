name: Deploy Docs (beta trigger)

# The beta branch cannot publish the site itself.
#
# A repository gets one GitHub Pages deployment and `main` owns it, so the real build lives in
# main's copy of this workflow: it checks out both branches and assembles main at the root with this
# branch under /beta/. Trying to deploy from here fails with
#
#   Branch "systemcore" is not allowed to deploy to github-pages due to environment protection rules
#
# which is the environment doing its job. So a docs change on this branch asks main's workflow to
# run instead of duplicating a build that could never be published.
#
# The beta site's build steps are edited on `main`, not here.

on:
  push:
    branches: [ systemcore ]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ask-main-to-publish:
    runs-on: ubuntu-latest
    steps:
      # Tests run here rather than only in main's build, so a broken generator is attributed to the
      # commit that broke it instead of to whatever docs change triggered the next publish.
      - uses: actions/checkout@v4

      - name: Test the browser tools
        run: node --test docs/tools/**/*.test.mjs

      - name: Trigger the Pages build on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"
