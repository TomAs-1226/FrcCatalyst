name: Deploy Docs

# Publishes two sites from one GitHub Pages deployment.
#
# A repository gets exactly one Pages deployment, so the stable docs and the 2027/Systemcore beta
# docs cannot each own one. The build below assembles both into a single artifact: `main` at the
# root and the `systemcore-alpha6` branch under /beta/, which is the 2.x line that ships: the docs
# branch it used to build from was folded into it on 2026-09-19, so the site and the releases can no
# longer drift apart. The beta branch sets its own baseurl to match.
#
# This file must live on `main`, because that is the branch whose workflow GitHub runs for the Pages
# environment. Pushing docs to `systemcore` triggers it too, and it rebuilds both.

on:
  push:
    branches: [ main, master, upgrade/alpha-7 ]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # The 2.x branch the /beta/ site is built from. `systemcore-alpha6` was merged into
  # `upgrade/alpha-7` on 2026-09-25 and that is now the single 2.x line and the one 2.0.0 ships from,
  # so the beta site follows it.
  #
  # This name and the trigger below must BOTH be updated when the 2.x branch moves. Getting only one
  # of them is silent in a way that has now cost time twice: with a stale trigger a docs push matches
  # nothing at all, and with a stale BETA_BRANCH the build is green and publishes the OLD branch's
  # content — which reads as "my docs change did not take" with no failure anywhere to explain it.
  BETA_BRANCH: upgrade/alpha-7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the stable branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build the stable site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # The beta docs are built from their own branch, with their own _config.yml. Nothing is copied
      # between the two: they are separate sites that happen to share a host.
      - name: Check out the beta branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BETA_BRANCH }}
          path: beta-src

      - name: Build the beta site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./beta-src/docs
          destination: ./_site/beta

      # The tools generate code that is compiled against the library, so a generator that drifts from
      # CANRegistry would otherwise be found by a team at build time rather than here.
      - name: Test the beta browser tools
        run: node --test beta-src/docs/tools/**/*.test.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
