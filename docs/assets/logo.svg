<?xml version="1.0" encoding="UTF-8"?>
<!-- Catalyst mark. This is the same construction as the panel-and-bolt on banner.svg,
     enlarged, so the sidebar icon and the social card read as one identity.

     No lettering. just-the-docs renders `logo:` as a background-image inside a 60px-tall
     .site-title, so a wordmark drawn on a 512 canvas arrives about 7px tall and is a smudge.
     A mark survives that, and survives a 16px favicon.

     Tokens: #111726 panel, rgba(255,255,255,0.13/0.07) hairlines, #e94560 the one accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="FrcCatalyst">
  <title>FrcCatalyst</title>

  <defs>
    <clipPath id="markClip">
      <rect x="0" y="0" width="512" height="512" rx="128"/>
    </clipPath>
    <radialGradient id="markWash" cx="82%" cy="10%" r="78%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#markClip)">
    <rect x="0" y="0" width="512" height="512" fill="#111726"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#markWash)"/>
  </g>

  <!-- Depth by ground and hairline, never by shadow. The inner ring is craft at 512 and
       vanishes cleanly at favicon size instead of turning into mud. -->
  <rect x="32" y="32" width="448" height="448" rx="96"
        fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="127.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.13"/>

  <g transform="translate(101.9 95.2) scale(13.4)">
    <path d="M13 2L3 14h7v8l10-12h-7V2z" fill="#e94560"/>
  </g>
</svg>
