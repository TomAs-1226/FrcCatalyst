<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="Catalyst 2.0 - Rev 2 of the whole-robot library for FRC. 974 of 986 public methods kept their name.">
<!-- REV 2 - THE DRAWING SET.  Catalyst 2.0 launch sheet, 1280x640.

     The identity is a drawing set, because an engineering drawing already has this library's
     discipline built into its line types: continuous geometry is what exists, phantom dash is what
     ships but is not engaged, ghost is the previous revision. Every line weight here is a claim.

     THE FILL RULE, which is the whole reason this sheet works:
       a filled box means it was proven, an unfilled phantom box means it was only attempted.
     That is StateMachineCore's own invariant - current() is only ever a state whose arrival every
     gating mechanism confirmed - promoted to a drawing grammar. So "DRIVEN ON A ROBOT" is not a
     disclaimer in the copy, it is an unticked field in the title block, sitting directly under a
     ticked one. Nothing is hidden and nothing leads with it; it is filed in the box a drawing has
     always kept for status. The day it becomes true the box gets filled and no copy is rewritten.

     Rev 1 is never deleted from the sheet. It stays as the ghost row of the revision block and as
     the ghosted dimension under the bus diagram, which is what makes "second generation" a
     structure rather than a numeral set large.

     Fonts are system stacks on purpose. GitHub renders README SVGs through a proxy that does not
     fetch webfonts, and the PNG pipeline does not either - so an identity whose personality lives
     in a display webfont cannot ship here. Mono carries most of it, which is both the drafting
     gothic of a real title block and the one fallback that is reliable everywhere. -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C4CAC3" stroke-width="1" opacity="0.9"/>
    </pattern>
    <style>
      .mono { font-family: Consolas,"DejaVu Sans Mono","Liberation Mono",ui-monospace,monospace; }
      .sans { font-family: "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
      .lbl  { font-size:11px; letter-spacing:1.1px; fill:#5C635E; }
      .val  { font-size:12px; fill:#1A1E1B; }
      .zone { font-size:9px;  letter-spacing:.6px; fill:#5C635E; opacity:.75; }
      .note { font-size:11.5px; fill:#1A1E1B; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#E4E7E1"/>
  <rect x="24" y="24" width="1232" height="592" fill="url(#grid)"/>
  <rect x="24" y="24" width="1232" height="592" fill="none" stroke="#1A1E1B" stroke-width="1"/>
  <rect x="36" y="36" width="1208" height="568" fill="none" stroke="#5C635E" stroke-width="0.5" opacity="0.5"/>

  <g class="mono zone">
    <text x="29" y="128">A</text><text x="29" y="272">B</text>
    <text x="29" y="416">C</text><text x="29" y="560">D</text>
    <text x="176" y="34">1</text><text x="330" y="34">2</text><text x="484" y="34">3</text>
    <text x="638" y="34">4</text><text x="792" y="34">5</text><text x="946" y="34">6</text>
    <text x="1100" y="34">7</text><text x="1234" y="34">8</text>
  </g>
  <g stroke="#1A1E1B" stroke-width="1">
    <path d="M640 24v12M640 616v-12M24 320h12M1256 320h-12"/>
  </g>

  <!-- ============ eyebrow ============ -->
  <g transform="translate(64,74)">
    <text class="mono lbl" x="0" y="5">REV</text>
    <path d="M46 -12 L59 9 L33 9 Z" fill="none" stroke="#D6412A" stroke-width="1.6"/>
    <text class="mono" x="46" y="7" font-size="12" font-weight="700" fill="#D6412A" text-anchor="middle">2</text>
    <text class="mono lbl" x="74" y="5">WHOLE-ROBOT LIBRARY FOR FRC &#183; CTRE PHOENIX 6 &#183; TEAM 5805</text>
  </g>

  <!-- ============ headline, two tiers. The tonal drop does the work an accent colour would ==== -->
  <text class="sans" x="64" y="152" font-size="21" font-weight="500" fill="#5C635E">New computer. New JVM. New command framework.</text>
  <text class="sans" x="64" y="216" font-size="52" font-weight="800" fill="#1A1E1B"
        textLength="1000" lengthAdjust="spacingAndGlyphs">974 of 986 public methods kept their name.</text>
  <path d="M64 244H1064" stroke="#C4CAC3" stroke-width="1"/>
  <text class="sans" x="64" y="272" font-size="15.5" fill="#5C635E">The same library, redrawn for Limelight Systemcore, WPILib 2027 and Commands v3.</text>

  <!-- ============ the subject, drawn: five buses, three SPI controller groups ============
       can_s0..can_s4 are not five independent lanes. They are MCP2518FD controllers on three
       shared SPI hosts, and Catalyst is the only place in the FRC toolchain that models it.
       Two-one-two: asymmetric in a way no template would ever produce. -->
  <g transform="translate(64,320)">
    <text class="mono lbl" x="0" y="0">CAN &#183; PLAN VIEW &#183; SECTION A-A</text>

    <!-- vertical dimension: 5 buses at Rev 2, ghosted 1 at Rev 1 -->
    <g stroke="#5C635E" stroke-width="0.6">
      <path d="M84 30h-26M84 126h-26"/>
      <path d="M66 30v96"/>
      <path d="M62 36l4-6 4 6M62 120l4 6 4-6" fill="none"/>
    </g>
    <text class="mono" x="0" y="72" font-size="10.5" fill="#1A1E1B">5 BUSES</text>
    <text class="mono" x="0" y="88" font-size="10" fill="#B3BBB4">REV 1: 1</text>

    <g stroke="#1A1E1B" stroke-width="1.5">
      <path d="M96 30h242"/><path d="M96 54h242"/><path d="M96 78h242"/><path d="M96 102h242"/><path d="M96 126h242"/>
    </g>
    <g class="mono" font-size="10.5" fill="#5C635E">
      <text x="348" y="33">can_s0</text><text x="348" y="57">can_s1</text><text x="348" y="81">can_s2</text>
      <text x="348" y="105">can_s3</text><text x="348" y="129">can_s4</text>
    </g>
    <g stroke="#D6412A" stroke-width="1.25" fill="none">
      <path d="M420 30 h10 v24 h-10"/>
      <path d="M420 78 h10"/>
      <path d="M420 102 h10 v24 h-10"/>
    </g>
    <g stroke="#5C635E" stroke-width="0.75" stroke-dasharray="2 2">
      <path d="M430 42h30"/><path d="M430 78h30"/><path d="M430 114h30"/>
    </g>
    <g class="mono" font-size="10" fill="#1A1E1B">
      <text x="466" y="45">SPI 1</text><text x="466" y="81">SPI 2</text><text x="466" y="117">SPI 3</text>
    </g>
    <text class="mono lbl" x="0" y="160" font-size="10">3 CONTROLLER GROUPS &#183; 2-1-2 &#183; CANRegistry WARNS ON A PAIRED SPLIT</text>
  </g>

  <!-- ============ general notes ============ -->
  <g transform="translate(64,540)">
    <text class="mono lbl" x="0" y="0">GENERAL NOTES</text>
    <text class="mono note" x="0" y="21">1.  REQUIRES SYSTEMCORE OS BETA 14. A BUILD AGAINST ALPHA-7 ABORTS ON BETA 13.</text>
    <text class="mono note" x="0" y="40">2.  COMPETING THIS SEASON? STAY ON REV 1 &#8212; v1.12.0, WPILIB 2026, roboRIO.</text>
  </g>

  <!-- ============ revision block. Rev 1 stays on the sheet, ghosted and demoted ============ -->
  <g transform="translate(760,284)">
    <rect x="0" y="0" width="456" height="72" fill="none" stroke="#1A1E1B" stroke-width="1"/>
    <g stroke="#5C635E" stroke-width="0.5" opacity="0.6">
      <path d="M0 24h456M0 48h456M36 0v72M212 0v72M330 0v72"/>
    </g>
    <g class="mono lbl" font-size="9">
      <text x="9" y="16">REV</text><text x="46" y="16">TARGET</text>
      <text x="222" y="16">FRAMEWORK</text><text x="340" y="16">DATE</text>
    </g>
    <g class="mono" font-size="10.5" fill="#B3BBB4">
      <text x="14" y="40">1</text><text x="46" y="40">roboRIO &#183; WPILib 2026</text>
      <text x="222" y="40">commands v2</text><text x="340" y="40">2026-08</text>
    </g>
    <g class="mono" font-size="10.5" fill="#1A1E1B">
      <text x="46" y="64">Systemcore &#183; WPILib 2027</text>
      <text x="222" y="64">commands v3</text><text x="340" y="64">2026-09</text>
    </g>
    <path d="M18 51 L26 66 L10 66 Z" fill="none" stroke="#D6412A" stroke-width="1.3"/>
    <text class="mono" x="18" y="65" font-size="9" font-weight="700" fill="#D6412A" text-anchor="middle">2</text>
  </g>

  <!-- ============ title block, flush to the sheet border ============
       TITLE carries the wordmark, which is where a drawing has always put the name of the thing.
       The last two rows are the fill rule: a filled square was proven, a phantom-dashed empty
       square was only attempted. They sit adjacent on purpose - a checklist, not a caveat. -->
  <g transform="translate(760,372)">
    <rect x="0" y="0" width="456" height="232" fill="none" stroke="#1A1E1B" stroke-width="1"/>
    <g stroke="#5C635E" stroke-width="0.5" opacity="0.6">
      <path d="M0 46h456M0 80h456M0 114h456M0 148h456M0 182h456M0 214h456M170 46v168"/>
    </g>
    <text class="mono lbl" x="12" y="19" font-size="9">TITLE</text>
    <text class="sans" x="12" y="38" font-size="25" font-weight="800" fill="#1A1E1B" letter-spacing="1.5">CATALYST</text>
    <text class="mono" x="444" y="38" font-size="19" font-weight="700" fill="#D6412A" text-anchor="end">2.0</text>

    <g class="mono lbl" font-size="9.5">
      <text x="12" y="67">DWG NO</text><text x="12" y="101">SCALE</text><text x="12" y="135">TARGET</text>
      <text x="12" y="169">TESTED</text><text x="12" y="203">DRIVEN ON A ROBOT</text>
    </g>
    <g class="mono val">
      <text x="182" y="67" font-weight="700">2.0.0-beta.1</text>
      <text x="182" y="101">254 files &#183; 60,145 lines</text>
      <text x="182" y="135">Systemcore &#183; alpha-7 &#183; Java 25</text>
    </g>
    <rect x="182" y="159" width="11" height="11" fill="#1A1E1B"/>
    <text class="mono val" x="201" y="169">867 tests, 0 failures</text>
    <rect x="182" y="193" width="11" height="11" fill="none" stroke="#D6412A" stroke-width="1.3" stroke-dasharray="2.5 2"/>
    <text class="mono" x="201" y="203" font-size="12" fill="#5C635E">bench only &#8212; see README</text>

    <g class="mono lbl" font-size="9">
      <text x="12" y="225">DRAWN BY TEAM 5805</text>
      <text x="444" y="225" text-anchor="end">SHEET 1 OF 1</text>
    </g>
  </g>

  <g transform="translate(64,604)" stroke="#5C635E" stroke-width="0.75" opacity="0.8">
    <path d="M-6 0h12M0 -6v12"/>
  </g>
  <text class="mono zone" x="78" y="607">0,0</text>
</svg>
