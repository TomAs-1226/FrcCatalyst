<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="FrcCatalyst 2.0 — different computer, same library. A swerve robot following an autonomous trajectory. WPILib 2027, Limelight Systemcore and Commands v3. Version 2.0.0-alpha.2, pre-season.">
  <title>FrcCatalyst 2.0</title>

  <!--
    Square, for the places a launch actually gets posted - Discord, Chief Delphi, Instagram - where a
    2:1 card gets letterboxed or cropped through the middle. Centred rather than left-aligned because
    a square read at thumbnail size has no reading order to preserve.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191a20"/>
      <stop offset="55%" stop-color="#101116"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="66%" cy="72%" r="50%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#e94560" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimLight" cx="20%" cy="14%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="traj" gradientUnits="userSpaceOnUse" x1="-20" y1="0" x2="760" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0"/>
      <stop offset="28%" stop-color="#e94560" stop-opacity="0.40"/>
      <stop offset="68%" stop-color="#ff5d76" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ff6b81" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="trajGlow" gradientUnits="userSpaceOnUse" x1="-20" y1="0" x2="760" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff5d76" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff5d76" stop-opacity="0.42"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="tightGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e94560" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#ground)"/>
  <rect width="1080" height="1080" fill="url(#keyLight)"/>
  <rect width="1080" height="1080" fill="url(#rimLight)"/>

  <text x="1040" y="1032" text-anchor="end"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="400" font-weight="700"
        letter-spacing="-22" fill="#ffffff" fill-opacity="0.03">2.0</text>

  <!-- Mark, centred above the wordmark rather than beside it: at this aspect the lockup reads better
       stacked, and it leaves the whole lower half to the trajectory. -->
  <g transform="translate(506 232) scale(2.9)">
    <path d="M13.5 2 5 13h5l-1.5 9L19 10h-5.5z" fill="#e94560"/>
  </g>

  <text x="540" y="410" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="82">
    <tspan font-weight="200" letter-spacing="-2.4" fill="#8d8f97">Frc</tspan><tspan
           font-weight="700" letter-spacing="-3.4" fill="#ffffff">Catalyst</tspan><tspan
           font-weight="200" letter-spacing="-2.4" fill="#ff5d76" dx="22">2.0</tspan>
  </text>

  <rect x="270" y="444" width="540" height="2" fill="url(#hair)"/>

  <text x="540" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="34" font-weight="600" fill="#e6e7ea">Different computer, same library.</text>

  <text x="540" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="19" font-weight="500" fill="#83858d">WPILib 2027 · Limelight Systemcore · Commands v3</text>

  <g transform="translate(370 578)">
    <rect width="176" height="36" rx="18" fill="#e94560" fill-opacity="0.14" stroke="#e94560" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="23" cy="18" r="5" fill="#ff5d76"/>
    <text x="40" y="24" font-family="Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#ff92a3">2.0.0-alpha.2</text>
  </g>
  <text x="562" y="602" font-family="Consolas, ui-monospace, monospace" font-size="13"
        font-weight="700" letter-spacing="1.8" fill="#6b6d75">PRE-SEASON</text>

  <path id="route" d="M-20 962 C180 956 340 928 470 878 C600 828 680 790 762 764"
        fill="none" stroke="url(#trajGlow)" stroke-width="13" stroke-linecap="round" filter="url(#softGlow)"/>
  <use href="#route" stroke="url(#trajGlow)" stroke-width="5" filter="url(#tightGlow)"/>
  <use href="#route" stroke="url(#traj)" stroke-width="3.8"/>

  <g fill="#ff8fa0">
    <circle cx="120" cy="958" r="3"   fill-opacity="0.16"/>
    <circle cx="300" cy="936" r="3.2" fill-opacity="0.32"/>
    <circle cx="450" cy="886" r="3.4" fill-opacity="0.5"/>
    <circle cx="600" cy="826" r="3.6" fill-opacity="0.7"/>
    <circle cx="700" cy="788" r="3.8" fill-opacity="0.88"/>
  </g>

  <path d="M762 764 C846 742 930 728 1010 722"
        fill="none" stroke="#ff5d76" stroke-opacity="0.5" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="2 13"/>
  <circle cx="1010" cy="722" r="7" fill="none" stroke="#ff8fa0" stroke-width="2.4" stroke-opacity="0.75"/>

  <!-- The robot. -->
  <g transform="translate(762 764) rotate(-14) scale(1.5)">
    <rect x="-56" y="-44" width="112" height="92" rx="16" fill="#000000" fill-opacity="0.55" filter="url(#drop)"/>

    <rect x="-58" y="-48" width="116" height="96" rx="15" fill="none" stroke="#8e2739" stroke-width="7.5"/>
    <path d="M43 -48 h0 a15 15 0 0 1 15 15 v66 a15 15 0 0 1 -15 15 h0"
          fill="none" stroke="#ff5d76" stroke-width="7.5" stroke-linecap="butt"/>

    <rect x="-52" y="-42" width="104" height="84" rx="9" fill="#14151a" stroke="#3d404a" stroke-width="1.4"/>
    <path d="M-45 -41.3 h90" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.4" stroke-linecap="round"/>

    <g>
      <g transform="translate(-32 -27)">
        <rect x="-13" y="-11" width="26" height="22" rx="5" fill="#1e2127" stroke="#474a53" stroke-width="1.2"/>
        <g transform="rotate(-24)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" fill="#0c0d11" stroke="#82858f" stroke-width="1.3"/></g>
      </g>
      <g transform="translate(32 -27)">
        <rect x="-13" y="-11" width="26" height="22" rx="5" fill="#1e2127" stroke="#474a53" stroke-width="1.2"/>
        <g transform="rotate(-24)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" fill="#0c0d11" stroke="#82858f" stroke-width="1.3"/></g>
      </g>
      <g transform="translate(-32 27)">
        <rect x="-13" y="-11" width="26" height="22" rx="5" fill="#1e2127" stroke="#474a53" stroke-width="1.2"/>
        <g transform="rotate(-24)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" fill="#0c0d11" stroke="#82858f" stroke-width="1.3"/></g>
      </g>
      <g transform="translate(32 27)">
        <rect x="-13" y="-11" width="26" height="22" rx="5" fill="#1e2127" stroke="#474a53" stroke-width="1.2"/>
        <g transform="rotate(-24)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" fill="#0c0d11" stroke="#82858f" stroke-width="1.3"/></g>
      </g>
    </g>

    <circle cx="0" cy="0" r="3" fill="#82858f"/>
  </g>
</svg>
