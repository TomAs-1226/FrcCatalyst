<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="FrcCatalyst 2.0 release card. WPILib 2027, Limelight Systemcore and Commands v3, with five renamed command decorators and the new Systemcore classes.">
  <title>FrcCatalyst 2.0 — release card</title>

  <!--
    The card a team actually reads before deciding whether to move. It answers the only two questions
    that matter in that moment - what changed underneath, and what do I have to edit - and it answers
    the second one exhaustively, because "four things" is worth nothing if the reader has to go and
    find out which four.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191a20"/>
      <stop offset="55%" stop-color="#101116"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="pool" cx="16%" cy="10%" r="54%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- The same key light as the banner, here behind the header rather than a plateau. -->
    <radialGradient id="keyLight" cx="72%" cy="6%" r="46%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c2e34" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2c2e34" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" rx="20" fill="url(#ground)"/>
  <rect width="1200" height="820" rx="20" fill="url(#pool)"/>
  <rect width="1200" height="820" rx="20" fill="url(#keyLight)"/>

  <!-- Scale contrast, as on the banner: the release oversized and dropped into the ground. -->
  <text x="1150" y="196" text-anchor="end"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="200" font-weight="700"
        letter-spacing="-11" fill="#ffffff" fill-opacity="0.03">2.0</text>

  <!-- Header -->
  <g transform="translate(72 62) scale(2.2)">
    <path d="M13.5 2 5 13h5l-1.5 9L19 10h-5.5z" fill="#e94560"/>
  </g>

  <text x="128" y="98" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52">
    <tspan font-weight="200" letter-spacing="-1.4" fill="#9a9ba1">Frc</tspan><tspan
           font-weight="700" letter-spacing="-2" fill="#ffffff">Catalyst</tspan><tspan
           font-weight="200" letter-spacing="-1.4" fill="#e94560" dx="14">2.0</tspan>
  </text>

  <g transform="translate(560 74)">
    <rect width="136" height="26" rx="13" fill="#e94560" fill-opacity="0.12" stroke="#e94560" stroke-opacity="0.55"/>
    <circle cx="17" cy="13" r="3.5" fill="#e94560"/>
    <text x="29" y="17.5" font-family="Consolas, ui-monospace, monospace" font-size="12" font-weight="600" fill="#f07183">2.0.0-alpha.2</text>
  </g>
  <text x="712" y="91.5" font-family="Consolas, ui-monospace, monospace" font-size="11" font-weight="700"
        letter-spacing="1.4" fill="#5c5e65">PRE-SEASON</text>

  <text x="128" y="136" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#c9cad0">Different computer, same library.</text>

  <rect x="72" y="168" width="600" height="1.5" fill="url(#sweep)"/>

  <!-- Left column: what moved underneath, none of which is a team's problem. -->
  <text x="72" y="216" font-family="Consolas, ui-monospace, monospace" font-size="11"
        font-weight="700" letter-spacing="1.8" fill="#5c5e65">WHAT MOVED UNDERNEATH</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#9a9ba1">
    <g>
      <rect x="72" y="240" width="2.5" height="42" rx="1.25" fill="#e94560" fill-opacity="0.55"/>
      <text x="92" y="256" font-size="15" font-weight="600" fill="#ffffff">WPILib 2027</text>
      <text x="92" y="277">The package root moved from edu.wpi.first to org.wpilib.</text>
    </g>
    <g>
      <rect x="72" y="300" width="2.5" height="42" rx="1.25" fill="#e94560" fill-opacity="0.55"/>
      <text x="92" y="316" font-size="15" font-weight="600" fill="#ffffff">Commands v3</text>
      <text x="92" y="337">A new framework built on JDK continuations, not iteration.</text>
    </g>
    <g>
      <rect x="72" y="360" width="2.5" height="42" rx="1.25" fill="#e94560" fill-opacity="0.55"/>
      <text x="92" y="376" font-size="15" font-weight="600" fill="#ffffff">Limelight Systemcore</text>
      <text x="92" y="397">One CAN bus became five. Two pairs share a controller.</text>
    </g>
  </g>

  <text x="72" y="446" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15"
        font-weight="500" fill="#70727a">None of it is a team&#8217;s problem. Every builder, every mechanism</text>
  <text x="72" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15"
        font-weight="500" fill="#70727a">signature and every binding call is where it was.</text>

  <!-- Right column: the exhaustive list, because "four things" is worthless without them. -->
  <text x="672" y="216" font-family="Consolas, ui-monospace, monospace" font-size="11"
        font-weight="700" letter-spacing="1.8" fill="#5c5e65">WHAT YOU ACTUALLY EDIT</text>

  <rect x="672" y="236" width="456" height="232" rx="12" fill="#131418" stroke="#23252b"/>
  <text x="694" y="262" font-family="Consolas, ui-monospace, monospace" font-size="11"
        font-weight="600" fill="#4b4d54">five command decorators, renamed</text>
  <line x1="672" y1="274" x2="1128" y2="274" stroke="#1e2026"/>

  <g font-family="Consolas, ui-monospace, monospace" font-size="14" font-weight="600">
    <g fill="#70727a">
      <text x="694" y="302">until</text>
      <text x="694" y="334">andThen</text>
      <text x="694" y="366">alongWith</text>
      <text x="694" y="398">raceWith</text>
      <text x="694" y="430">withTimeout</text>
    </g>
    <g fill="#e94560">
      <text x="838" y="302">&#8594;</text>
      <text x="838" y="334">&#8594;</text>
      <text x="838" y="366">&#8594;</text>
      <text x="838" y="398">&#8594;</text>
      <text x="838" y="430">&#8594;</text>
    </g>
    <g fill="#ffffff">
      <text x="874" y="302">untilTrue</text>
      <text x="874" y="334">then</text>
      <text x="874" y="366">together</text>
      <text x="874" y="398">racing</text>
      <text x="874" y="430">timeoutAfter</text>
    </g>
  </g>

  <!-- New surface, named rather than described: a team scanning this is looking for a word it
       recognises from its own robot. -->
  <rect x="72" y="524" width="1056" height="1" fill="url(#rule)"/>
  <text x="72" y="562" font-family="Consolas, ui-monospace, monospace" font-size="11"
        font-weight="700" letter-spacing="1.8" fill="#5c5e65">NEW, BECAUSE THE MACHINE CAN NOW BE ASKED</text>

  <g font-family="Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#c9cad0">
    <g fill="#1c1e23" stroke="#2f323a">
      <rect x="72"  y="580" width="158" height="32" rx="8"/>
      <rect x="242" y="580" width="100" height="32" rx="8"/>
      <rect x="354" y="580" width="146" height="32" rx="8"/>
      <rect x="512" y="580" width="96"  height="32" rx="8"/>
      <rect x="620" y="580" width="96"  height="32" rx="8"/>
    </g>
    <g fill="#c9cad0">
      <text x="90"  y="601">SystemCoreStatus</text>
      <text x="260" y="601">Preflight</text>
      <text x="372" y="601">CANBusPlanner</text>
      <text x="530" y="601">DualIMU</text>
      <text x="638" y="601">SmartIO</text>
    </g>
    <g fill="#1c1e23" stroke="#2f323a">
      <rect x="72"  y="624" width="174" height="32" rx="8"/>
      <rect x="258" y="624" width="134" height="32" rx="8"/>
      <rect x="404" y="624" width="158" height="32" rx="8"/>
      <rect x="574" y="624" width="116" height="32" rx="8"/>
    </g>
    <g fill="#c9cad0">
      <text x="90"  y="645">GamePieceDetector</text>
      <text x="276" y="645">SysIdRoutine</text>
      <text x="422" y="645">CatalystOpMode</text>
      <text x="592" y="645">CatalystI2C</text>
    </g>
  </g>

  <!-- The pairing warning, said here because it is the one way to brick a weekend. -->
  <rect x="72" y="692" width="1056" height="64" rx="10" fill="#e94560" fill-opacity="0.07" stroke="#e94560" stroke-opacity="0.28"/>
  <circle cx="100" cy="724" r="8" fill="none" stroke="#e94560" stroke-width="1.6"/>
  <line x1="100" y1="720" x2="100" y2="725" stroke="#e94560" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="100" cy="729.5" r="1" fill="#e94560"/>
  <text x="124" y="718" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14"
        font-weight="600" fill="#f07183">Match the pairing before flashing anything.</text>
  <text x="124" y="738" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5"
        fill="#9a9ba1">This build targets the released WPILib 2027.0.0-alpha-6, which is what Systemcore OS beta 13 runs. The development snapshot is a different API.</text>

  <text x="72" y="790" font-family="Consolas, ui-monospace, monospace" font-size="12"
        font-weight="600" fill="#4b4d54">github.com/TomAs-1226/FrcCatalyst</text>
</svg>
