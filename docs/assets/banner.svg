<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 420" width="2400" height="420" role="img"
     aria-label="Catalyst 2.0 - the whole-robot library for FRC, redrawn for Limelight Systemcore.">
<!-- REV 2 - THE DRAWING SET.  Wide repo banner, 2400x420.  Sheet 2 of the set.

     Same sheet language as social-card.svg, re-composed for a 5.7:1 strip: the drawing rotates to
     the CAN plan view running the length of the banner, and the title block collapses to a right
     column. The fill rule is preserved - a ticked row and an unticked row, adjacent. -->
  <defs>
    <pattern id="g2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#C4CAC3" stroke-width="1" opacity="0.9"/>
    </pattern>
    <style>
      .mono { font-family: Consolas,"DejaVu Sans Mono","Liberation Mono",ui-monospace,monospace; }
      .sans { font-family: "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
      .lbl  { font-size:12px; letter-spacing:1.2px; fill:#5C635E; }
    </style>
  </defs>

  <rect width="2400" height="420" fill="#E4E7E1"/>
  <rect x="24" y="24" width="2352" height="372" fill="url(#g2)"/>
  <rect x="24" y="24" width="2352" height="372" fill="none" stroke="#1A1E1B" stroke-width="1"/>
  <rect x="36" y="36" width="2328" height="348" fill="none" stroke="#5C635E" stroke-width="0.5" opacity="0.5"/>
  <g stroke="#1A1E1B" stroke-width="1">
    <path d="M1200 24v12M1200 396v-12M24 210h12M2376 210h-12"/>
  </g>

  <!-- ============ identity ============ -->
  <g transform="translate(76,92)">
    <text class="mono lbl" x="0" y="5">REV</text>
    <path d="M48 -13 L62 10 L34 10 Z" fill="none" stroke="#D6412A" stroke-width="1.8"/>
    <text class="mono" x="48" y="8" font-size="13" font-weight="700" fill="#D6412A" text-anchor="middle">2</text>
    <text class="mono lbl" x="80" y="5">WHOLE-ROBOT LIBRARY FOR FRC &#183; TEAM 5805</text>
  </g>
  <text class="sans" x="76" y="216" font-size="86" font-weight="800" fill="#1A1E1B" letter-spacing="3">CATALYST</text>
  <text class="mono" x="571" y="216" font-size="52" font-weight="700" fill="#D6412A">2.0</text>
  <path d="M76 248H700" stroke="#C4CAC3" stroke-width="1"/>
  <text class="sans" x="76" y="284" font-size="21" font-weight="500" fill="#5C635E">New computer. New JVM. New command framework.</text>
  <text class="sans" x="76" y="316" font-size="21" font-weight="700" fill="#1A1E1B">974 of 986 public methods kept their name.</text>

  <!-- ============ CAN plan view, running the length ============ -->
  <g transform="translate(800,120)">
    <text class="mono lbl" x="0" y="-16" font-size="11">CAN &#183; PLAN VIEW &#183; can_s0 THROUGH can_s4</text>
    <g stroke="#1A1E1B" stroke-width="1.6">
      <path d="M0 0h600"/><path d="M0 30h600"/><path d="M0 60h600"/><path d="M0 90h600"/><path d="M0 120h600"/>
    </g>
    <g class="mono" font-size="11.5" fill="#5C635E">
      <text x="612" y="4">can_s0</text><text x="612" y="34">can_s1</text><text x="612" y="64">can_s2</text>
      <text x="612" y="94">can_s3</text><text x="612" y="124">can_s4</text>
    </g>
    <g stroke="#D6412A" stroke-width="1.4" fill="none">
      <path d="M694 0 h12 v30 h-12"/>
      <path d="M694 60 h12"/>
      <path d="M694 90 h12 v30 h-12"/>
    </g>
    <g stroke="#5C635E" stroke-width="0.8" stroke-dasharray="2 2">
      <path d="M706 15h34"/><path d="M706 60h34"/><path d="M706 105h34"/>
    </g>
    <g class="mono" font-size="11" fill="#1A1E1B">
      <text x="746" y="19">SPI 1</text><text x="746" y="64">SPI 2</text><text x="746" y="109">SPI 3</text>
    </g>
    <text class="mono lbl" x="0" y="156" font-size="11">3 CONTROLLER GROUPS &#183; 2-1-2 &#183; NOT FIVE INDEPENDENT LANES</text>
  </g>

  <!-- ============ title block, right column ============ -->
  <g transform="translate(1712,72)">
    <rect x="0" y="0" width="628" height="276" fill="none" stroke="#1A1E1B" stroke-width="1"/>
    <g stroke="#5C635E" stroke-width="0.5" opacity="0.6">
      <path d="M0 54h628M0 100h628M0 146h628M0 192h628M0 238h628M232 54v184"/>
    </g>
    <text class="mono lbl" x="16" y="22" font-size="10">TITLE</text>
    <text class="sans" x="16" y="44" font-size="27" font-weight="800" fill="#1A1E1B" letter-spacing="1.5">CATALYST</text>
    <text class="mono" x="612" y="44" font-size="20" font-weight="700" fill="#D6412A" text-anchor="end">2.0.0-beta.1</text>
    <g class="mono lbl" font-size="10.5">
      <text x="16" y="82">SCALE</text><text x="16" y="128">TARGET</text>
      <text x="16" y="174">TESTED</text><text x="16" y="220">DRIVEN ON A ROBOT</text>
    </g>
    <g class="mono" font-size="13" fill="#1A1E1B">
      <text x="248" y="82">254 files &#183; 60,145 lines</text>
      <text x="248" y="128">Systemcore &#183; WPILib 2027 a7</text>
    </g>
    <rect x="248" y="163" width="12" height="12" fill="#1A1E1B"/>
    <text class="mono" x="269" y="174" font-size="13" fill="#1A1E1B">867 tests, 0 failures</text>
    <rect x="248" y="209" width="12" height="12" fill="none" stroke="#D6412A" stroke-width="1.4" stroke-dasharray="2.5 2"/>
    <text class="mono" x="269" y="220" font-size="13" fill="#5C635E">bench only &#8212; see README</text>
    <g class="mono lbl" font-size="10">
      <text x="16" y="262">DRAWN BY TEAM 5805</text>
      <text x="612" y="262" text-anchor="end">SHEET 2 OF 2</text>
    </g>
  </g>

  <g transform="translate(76,372)" stroke="#5C635E" stroke-width="0.75" opacity="0.8">
    <path d="M-6 0h12M0 -6v12"/>
  </g>
  <text class="mono" x="90" y="375" font-size="9" fill="#5C635E" opacity="0.75">0,0</text>
</svg>
