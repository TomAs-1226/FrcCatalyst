title: FrcCatalyst
description: Pre-built FRC mechanisms and utilities for CTRE Phoenix 6 + WPILib 2026
baseurl: "/FrcCatalyst"
url: "https://tomas-1226.github.io"

remote_theme: just-the-docs/just-the-docs

color_scheme: dark

# Logo and aux links
logo: "/assets/logo.svg"
aux_links:
  "Tools":
    - "/FrcCatalyst/tools/"
  "Releases":
    - "https://github.com/TomAs-1226/FrcCatalyst/releases"
  "GitHub":
    - "https://github.com/TomAs-1226/FrcCatalyst"

# GitHub + Releases open externally; the Tools link stays in-tab.
aux_links_new_tab: false

# What this site documents. _includes/header_custom.html puts it at the top of every page and the
# footer repeats it, so no page is read without knowing which Catalyst it describes. The 2.x sites
# carry their own values on their own branches.
# (The key is not `documents:` - Jekyll already uses site.documents for every document in every
# collection, and a config key of that name is silently shadowed.)
catalyst_docs:
  version: "1.12.0"
  platform: "roboRIO &middot; WPILib 2026.2.1"
  versions_url: "https://tomas-1226.github.io/FrcCatalyst/versions.html"

# Footer
footer_content: 'Documents Catalyst 1.12.0 (roboRIO, WPILib 2026.2.1). Other versions: <a href="https://tomas-1226.github.io/FrcCatalyst/versions.html">Versions and compatibility</a>. Built for the FRC community. Go build something awesome.'

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Callouts
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Mermaid diagrams (used by the State Machine Internals page). just-the-docs loads
# mermaid from jsDelivr; pinning the version keeps the render stable.
mermaid:
  version: "10.9.0"
