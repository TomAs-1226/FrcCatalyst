plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.frccatalyst'
version = '2.0.0-alpha.1'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
    withJavadocJar()
}

// ---------------------------------------------------------------------------
// WPILib 2027 / Systemcore
//
// 2027 is not a version bump. The package root moved from `edu.wpi.first` to `org.wpilib`, the
// hardware classes were reorganised into `org.wpilib.hardware.*`, and commands v2 was replaced by
// commands v3 (coroutines on JDK continuations, which is why Java 25 above is a hard requirement
// and not a preference).
//
// The version below is a CI snapshot from WPILib's development repository, not a release. The
// released alpha-6 artifacts ship inside the 2.6 GB WPILib installer's local maven and are not
// otherwise fetchable; the snapshot is the same code and lets this library build without it.
// Re-pin to alpha-7 when it is published - Systemcore OS beta 14 requires it, and until then this
// branch pairs with OS beta 13.
// ---------------------------------------------------------------------------
ext {
    wpilibVersion = '2027.0.0-alpha-6-360-gcaf0fb2dc'
    phoenixVersion = '26.50.0-alpha-1'
    pathplannerVersion = '2027.0.0-alpha-3'
    limelightVersion = '2.0.0-beta2'
}

repositories {
    mavenLocal()
    mavenCentral()

    // Local WPILib installation (only used when available, e.g. developer machines).
    // The 2027 installer lands in a folder named for the alpha it was cut from, not the alpha it
    // contains - alpha-6 installs to `2027_alpha5`. Probe the known names rather than guessing one.
    String userHome = System.getProperty('user.home')
    String publicFolder = System.getenv('PUBLIC') ?: 'C:\\Users\\Public'
    ['wpilib/2027/maven', 'wpilib/2027_alpha5/maven', 'wpilib/2027_alpha1/maven'].each { rel ->
        [new File(publicFolder, rel), new File(userHome, rel)].each { dir ->
            if (dir.exists()) {
                maven {
                    name 'frcHome'
                    url dir
                }
            }
        }
    }

    // WPILib remote. 2027 alphas are published to `development`, not `release`.
    maven { url "https://frcmaven.wpi.edu/artifactory/development/" }
    maven { url "https://frcmaven.wpi.edu/artifactory/release/" }

    // CTRE Phoenix 6
    maven { url "https://maven.ctr-electronics.com/release/" }

    // PathPlanner
    maven { url "https://3015rangerrobotics.github.io/pathplannerlib/repo" }

    // LimelightLib 2
    maven { url "https://limelightvision.github.io/limelightlib-public/maven/" }
}

dependencies {
    // WPILib core
    // WPILib 2027. Every coordinate below was verified resolvable against
    // frcmaven .../artifactory/development before being written here.
    //
    // The 2027 poms are flat - they declare no transitive dependencies - so each jar that used to
    // arrive for free has to be named. wpinet, datalog and fields are new entries for that reason,
    // not new functionality.
    api "org.wpilib.wpilibj:wpilibj-java:${wpilibVersion}"
    api "org.wpilib.wpiutil:wpiutil-java:${wpilibVersion}"
    api "org.wpilib.wpimath:wpimath-java:${wpilibVersion}"
    api "org.wpilib.wpiunits:wpiunits-java:${wpilibVersion}"
    api "org.wpilib.ntcore:ntcore-java:${wpilibVersion}"
    api "org.wpilib.wpinet:wpinet-java:${wpilibVersion}"
    api "org.wpilib.cscore:cscore-java:${wpilibVersion}"
    api "org.wpilib.hal:hal-java:${wpilibVersion}"
    api "org.wpilib.apriltag:apriltag-java:${wpilibVersion}"
    api "org.wpilib.datalog:datalog-java:${wpilibVersion}"
    api "org.wpilib.fields:fields-java:${wpilibVersion}"

    // New in 2027. `telemetry` is what replaced SmartDashboard and is where Catalyst's logging
    // now lands (see WpiTelemetrySink); `tunables` is what replaced SendableChooser and backs
    // AutoSelector. Both are the same facade-over-swappable-backend shape Catalyst already used,
    // which is why adopting them changed no Catalyst signatures.
    api "org.wpilib.telemetry:telemetry-java:${wpilibVersion}"
    api "org.wpilib.tunables:tunables-java:${wpilibVersion}"

    // Commands v3 replaces wpilibNewCommands. Catalyst's own command-facing API is unchanged for
    // teams - Superstructure, the mechanism builders and the binding DSL keep their signatures.
    // v3 is an implementation detail below that line.
    api "org.wpilib:commandsv3-java:${wpilibVersion}"

    // Commands v2, present only so PathPlanner works.
    //
    // PathPlannerLib 2027.0.0-alpha-3 is still compiled against org.wpilib.command2 - AutoBuilder
    // hands back v2 commands. Catalyst is v3 throughout, so without this the whole PathPlanner
    // integration is unbuildable. See frc.lib.catalyst.command.LegacyCommands for the bridge that
    // makes a v2 command runnable on the v3 scheduler. Drop both when PathPlanner ships for v3.
    api "org.wpilib.commandsv2:commandsv2-java:${wpilibVersion}"

    // CTRE Phoenix 6
    api "com.ctre.phoenix6:wpiapi-java:${phoenixVersion}"

    // PathPlanner (commonly used with swerve)
    api "com.pathplanner.lib:PathplannerLib-java:${pathplannerVersion}"

    // LimelightLib 2. Catalyst read Limelight NetworkTables by hand for years specifically to avoid
    // this dependency, and that stopped being viable in 2027: Limelight OS now publishes results as
    // a single MessagePack topic and disables the classic per-key API by default. Hand-decoding
    // MessagePack to avoid a vendordep would be a worse trade than taking the vendordep.
    api "com.limelightvision:limelightlib-java:${limelightVersion}"

    // PhotonVision is deliberately absent. There is no 2027 vendordep, and Catalyst is moving to
    // Limelight-first vision because the pipeline is built into Systemcore. PhotonSource is
    // excluded from the source set in build.gradle rather than deleted, so the file survives if
    // a 2027 PhotonVision ever ships.

    // Tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // wpimath geometry classes need quickbuf at runtime (protobuf serialization).
    testRuntimeOnly 'us.hebi.quickbuf:quickbuf-runtime:1.4'
    // SwerveDriveKinematics builds a SimpleMatrix, so wpimath needs EJML at runtime too.
    testRuntimeOnly 'org.ejml:ejml-simple:0.44.0'
}

// PhotonVision has no 2027 release. Keep the source file in the tree but out of the compile,
// so the branch builds and nothing is lost if PhotonVision ships a 2027 vendordep later.
sourceSets {
    main {
        java {
            exclude 'frc/lib/catalyst/subsystems/vision/PhotonSource.java'
        }
    }
}

// ---------------------------------------------------------------------------
// Desktop JNI natives for the test JVM
//
// Some tests touch the HAL - RobotIdentity's spec sheet reads the team number, for instance. Those
// calls are guarded, but the guard cannot help: WPILib's RuntimeLoader terminates the JVM when a
// native is missing rather than throwing, so the whole Gradle test worker dies with "wpiHaljni
// could not be loaded from path" and no test results at all.
//
// GradleRIO normally handles this. This is a plain java-library, and 2027's poms are flat, so the
// natives have to be fetched and unpacked by hand. They are published per-platform as zips.
// ---------------------------------------------------------------------------
configurations {
    nativeDesktop
}

// Which desktop natives to unpack. Hardcoding Windows meant the test task only ever worked on one
// machine: CI runs on Linux, unpacked a directory of DLLs, and failed loading the HAL with an error
// about a missing library rather than about the wrong platform.
def desktopClassifier = {
    String os = System.getProperty('os.name').toLowerCase()
    String arch = System.getProperty('os.arch').toLowerCase()
    boolean arm = arch.contains('aarch64') || arch.contains('arm64')
    if (os.contains('win')) {
        return arm ? 'windowsarm64' : 'windowsx86-64'
    }
    if (os.contains('mac') || os.contains('darwin')) {
        return 'osxuniversal'
    }
    return arm ? 'linuxarm64' : 'linuxx86-64'
}()

dependencies {
    nativeDesktop "org.wpilib.hal:hal-cpp:${wpilibVersion}:${desktopClassifier}@zip"
    nativeDesktop "org.wpilib.wpiutil:wpiutil-cpp:${wpilibVersion}:${desktopClassifier}@zip"
    nativeDesktop "org.wpilib.wpimath:wpimath-cpp:${wpilibVersion}:${desktopClassifier}@zip"
    nativeDesktop "org.wpilib.ntcore:ntcore-cpp:${wpilibVersion}:${desktopClassifier}@zip"
    nativeDesktop "org.wpilib.wpinet:wpinet-cpp:${wpilibVersion}:${desktopClassifier}@zip"

    // 2027 split these out of wpiutil/ntcore into their own libraries. wpimath.dll links against
    // telemetry and tunables, and ntcore against datalog, so leaving them out makes every JNI load
    // fail with "Can't find dependent libraries" - which names the library that failed, never the
    // one actually missing.
    nativeDesktop "org.wpilib.telemetry:telemetry-cpp:${wpilibVersion}:${desktopClassifier}@zip"
    nativeDesktop "org.wpilib.tunables:tunables-cpp:${wpilibVersion}:${desktopClassifier}@zip"
    nativeDesktop "org.wpilib.datalog:datalog-cpp:${wpilibVersion}:${desktopClassifier}@zip"

    // Phoenix's desktop simulation natives.
    //
    // Without these, constructing any Catalyst mechanism *terminates the JVM*. Phoenix's loader
    // behaves like WPILib's: a missing native is a process exit, not an exception, so a test that
    // merely builds a FlywheelMechanism takes the Gradle worker down and loses every other result.
    // That is why the mechanism classes had no tests - not because they were untestable, but
    // because nobody had unpacked these.
    //
    // api-cpp-sim and tools-sim are the runtime; the simPro* libraries are the device models that
    // make a TalonFX or a Pigeon respond to being commanded.
    nativeDesktop "com.ctre.phoenix6.sim:api-cpp-sim:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:tools-sim:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simProTalonFX:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simProTalonFXS:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simProCANcoder:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simProPigeon2:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simProCANdi:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simProCANdle:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simProCANrange:${phoenixVersion}:${desktopClassifier}@zip"
    // CTRE_PhoenixTools_Sim links against these three by name even on a robot with none of them, so
    // leaving them out makes the whole Phoenix sim stack fail to load - and Phoenix answers a failed
    // load with System.exit(1), which is why a missing legacy device model killed the JVM.
    nativeDesktop "com.ctre.phoenix6.sim:simTalonSRX:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simVictorSPX:${phoenixVersion}:${desktopClassifier}@zip"
    nativeDesktop "com.ctre.phoenix6.sim:simPigeonIMU:${phoenixVersion}:${desktopClassifier}@zip"
}

def nativeLibsDir = layout.buildDirectory.dir('nativeLibs')

tasks.register('extractNativeLibs', Copy) {
    description = 'Unpacks the desktop JNI natives the test JVM needs.'
    from { configurations.nativeDesktop.collect { zipTree(it) } }
    into nativeLibsDir
    include '**/*.dll', '**/*.so', '**/*.dylib'
    eachFile { it.path = it.name }   // flatten; java.library.path wants one directory
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()

    // Commands v3 is built on JDK continuations, which live in jdk.internal.vm and are reached by
    // reflection. Without this the Scheduler class fails to initialise - not at first use, but on
    // static init, so the failure surfaces as ExceptionInInitializerError somewhere unrelated.
    // The robot JVM needs the same flag; see docs/advanced/systemcore.md.
    jvmArgs '--add-opens', 'java.base/jdk.internal.vm=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    testLogging { showStandardStreams = true }

    dependsOn tasks.named('extractNativeLibs')

    def libs = nativeLibsDir.get().asFile.absolutePath
    systemProperty 'java.library.path', libs

    // java.library.path gets the JNI stubs loaded, but each stub links against its own
    // implementation library (wpiHaljni -> wpiHal) and Windows resolves *those* off PATH, not
    // java.library.path. Without this the load fails with the unhelpful "Can't find dependent
    // libraries" even though every DLL is sitting in the same directory.
    // Windows names the variable "Path", not "PATH". Setting "PATH" alongside it just adds a second
    // entry the loader ignores, so find whatever key the environment actually uses and extend that.
    def pathKey = System.getenv().keySet().find { it.equalsIgnoreCase('PATH') } ?: 'PATH'
    environment pathKey, libs + File.pathSeparator + (System.getenv(pathKey) ?: '')
    environment 'LD_LIBRARY_PATH', libs + File.pathSeparator + (System.getenv('LD_LIBRARY_PATH') ?: '')
    environment 'DYLD_LIBRARY_PATH', libs + File.pathSeparator + (System.getenv('DYLD_LIBRARY_PATH') ?: '')
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.frccatalyst'
            artifactId = 'FrcCatalyst'
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

// ---------------------------------------------------------------------------
// Runtime version stamp
//
// `version` above never reached the artifact: the jar manifest carried nothing but
// Manifest-Version, so Package.getImplementationVersion() came back null and the library had no way
// to name itself. RobotIdentity publishes the Catalyst version on the wire, so it has to be a
// runtime fact.
//
// Generated as a source file rather than stamped onto the manifest, because a robot project shades
// Catalyst into its FRCUserProgram fat jar: manifests merge there and the robot's wins. A compiled
// constant survives shading, and survives running from a classes directory under `gradlew test`.
// ---------------------------------------------------------------------------

static String runCommand(File dir, List<String> command) {
    try {
        Process process = new ProcessBuilder(command).directory(dir).start()
        String out = process.inputStream.getText('UTF-8').trim()
        process.errorStream.close()
        return process.waitFor() == 0 ? out : ''
    } catch (Exception ignored) {
        // No git on PATH, or no repository at all - JitPack builds from a source archive with no
        // .git in it. An unknown build stamp is published as nothing, never as a placeholder.
        return ''
    }
}

ext {
    catalystGitSha = runCommand(projectDir, ['git', 'rev-parse', '--short', 'HEAD'])
    catalystGitTime = runCommand(projectDir, ['git', 'log', '-1', '--format=%cI'])
    catalystGitDirty = !catalystGitSha.isEmpty() &&
            !runCommand(projectDir, ['git', 'status', '--porcelain']).isEmpty()
}

def generatedVersionDir = layout.buildDirectory.dir('generated/sources/catalystVersion/java/main').get().asFile

def generateCatalystVersion = tasks.register('generateCatalystVersion') {
    description = 'Writes the compiled-in version and build stamp that CatalystVersion reads back.'
    // The commit is the input, not the wall clock. A build timestamp would put this task - and every
    // compile downstream of it - permanently out of date, and it says less than the commit does.
    inputs.property('version', project.version.toString())
    inputs.property('gitSha', catalystGitSha)
    inputs.property('gitTime', catalystGitTime)
    inputs.property('gitDirty', catalystGitDirty)
    outputs.dir(generatedVersionDir)
    doLast {
        File packageDir = new File(generatedVersionDir, 'frc/lib/catalyst/identity')
        packageDir.mkdirs()
        new File(packageDir, 'BuildConstants.java').write("""\
package frc.lib.catalyst.identity;

/**
 * Written by the generateCatalystVersion task in build.gradle. Do not edit, and do not read
 * directly - {@link CatalystVersion} is the documented way in, and is what turns a blank string
 * here back into "unknown".
 */
final class BuildConstants {

    static final String VERSION = "${project.version}";
    static final String GIT_SHA = "${catalystGitSha}";
    static final boolean GIT_DIRTY = ${catalystGitDirty};
    static final String GIT_TIME = "${catalystGitTime}";

    private BuildConstants() {}
}
""", 'UTF-8')
    }
}

sourceSets.main.java.srcDir generatedVersionDir
tasks.named('compileJava') { dependsOn generateCatalystVersion }
tasks.named('sourcesJar') { dependsOn generateCatalystVersion }
tasks.named('javadoc') { dependsOn generateCatalystVersion }

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:none'
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

// Temporary: surface every error, not just the first hundred, during the 2027 migration.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}
